[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for clear separation of fast unit tests from service-dependent integration tests
markers =
    unit: Fast unit tests that execute in memory without external service dependencies
    integration: Integration tests exercising multiple system layers
    requires_postgres: Tests that connect to local PostgreSQL instance
    requires_ollama: Tests that require local Ollama daemon and loaded models
    requires_cloud: Tests that require live OpenAI or Anthropic API credentials
